<body>

</svg>
<script>
  const q = new URLSearchParams(location.search)
  const pigment = '#' + (q.get('pigment') || 'ffc21a')
  const glyphs = {
    guard: '<path d="M36 17 L50 22 V34 C50 44 43 50 36 54 C29 50 22 44 22 34 V22 Z"/><path d="M30 35 L35 40 L43 30"/>',

  document.getElementById('swatch').setAttribute('fill', pigment)

  if (pigment.toLowerCase() === '#ffc21a') g.setAttribute('stroke', '#0e2638')
