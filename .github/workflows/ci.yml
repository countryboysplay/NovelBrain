name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:kit
      - name: Committed bundles match a fresh build
        shell: bash
        run: |
          npm run build:hooks
          git diff --exit-code -- resources/
      # The runner's screen is 1024x768, which clamps the 1400px window into the narrow layout (usage tag hidden,
      # terminal folded); the smoke tests check the wide one.
      - name: Screen at 1920x1080
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - run: npm run smoke
